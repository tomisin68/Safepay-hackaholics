# Render blueprint for the SafePay API.
#
# Render runs a long-lived Node process with a mountable disk, which is what the
# escrow ledger needs: the JSON store persists, the OTP sweeper keeps ticking,
# and webhook retries survive between requests.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.

services:
  - type: web
    name: safepay-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    # The ledger lives here. Without a disk the store resets on every deploy
    # and every cold start.
    disk:
      name: safepay-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20"

      - key: NODE_ENV
        value: production

      # Persistent disk mount — read by backend/src/store/index.js
      - key: DATA_DIR
        value: /var/data

      # Generated once by Render and kept across deploys. Never commit a real one.
      - key: JWT_SECRET
        generateValue: true

      # Comma-separated browser origins allowed to call the API.
      # Set this to your Vercel URL after the frontend is deployed, e.g.
      #   https://safepay-hackaholics.vercel.app
      - key: WEB_ORIGIN
        sync: false

      # Optional. Without it, dispute triage falls back to the deterministic
      # rule-based classifier and the feature still works.
      - key: GEMINI_API_KEY
        sync: false

      # The demo accounts (@safepay.test, password123) are created at boot,
      # because Render's free plan has no shell to run `npm run seed` from.
      # The bootstrap is additive and idempotent: it only creates what is
      # missing, so restarts never clobber real data. Set this to "false"
      # before treating the deployment as real — those accounts share one
      # published password and one of them is an administrator.
      - key: DEMO_ACCOUNTS
        value: "true"

      - key: PLATFORM_FEE_BPS
        value: "150"

      - key: RESERVE_SHARE_BPS
        value: "2000"

      # --- Firebase Admin (Authentication + Firestore) -------------------
      # The whole service-account JSON, base64-encoded. Base64 rather than raw
      # JSON because the private key's newlines survive a dashboard paste that
      # way; the loader accepts either. Generate with:
      #   node -e "console.log(Buffer.from(require('fs').readFileSync('serviceAccountKey.json','utf8')).toString('base64'))"
      #
      # Unset, the API still boots and serves from its local disk. Set, Firestore
      # becomes the durable source of truth and every signup also creates a
      # Firebase Auth user.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      # --- Keplars (transactional email) ---------------------------------
      # Required in production. Without it the OTP mailer falls back to printing
      # codes into this service's log, which is not something to run live.
      # Dashboard -> API Keys; the "live" kind: kms_<workspaceId>.live_<secret>
      - key: KEPLARS_API_KEY
        sync: false

      # Optional. Unset, Keplars sends as the mailbox connected to the
      # workspace, which is the right default until there is more than one
      # verified sender to choose between. An address Keplars does not
      # recognise is rejected rather than silently substituted.
      - key: MAIL_FROM
        sync: false

      # Public URL of the frontend. Used for the buttons inside emails.
      - key: APP_URL
        sync: false
