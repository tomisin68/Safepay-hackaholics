openapi: 3.0.3

info:
  title: SafePay API
  version: "1.0.0"
  description: |
    **Trusted payments, everywhere.**

    SafePay is an escrow, settlement and trust-scoring layer for Nigeria. Any
    application — a marketplace, a freelance platform, a storefront, a landlord's
    portal — can plug in so that a transaction between two people who do not fully
    trust each other becomes safe by default.

    ## Authentication

    Two credentials reach the same endpoints:

    | Credential | Header | Used by |
    |---|---|---|
    | Dashboard session (JWT) | `Authorization: Bearer eyJ…` | The SafePay web app |
    | API key | `Authorization: Bearer sk_test_…` | Partner applications |

    Keys come in pairs. `sk_test_` keys operate on simulated settlement — build the
    entire flow, including disputes and webhooks, without moving a naira.
    SafePay stores only a SHA-256 hash of every key, so a lost key is rotated,
    never recovered.

    ## Money

    Every amount crosses the wire as an **integer in kobo** (`amountKobo`). Endpoints
    that create an escrow also accept `amount` in naira as a convenience, and convert
    it. Floating point never touches a balance.

    ## Errors

    Failures return a consistent envelope:

    ```json
    { "error": { "code": "conflict", "message": "An escrow that is \"released\" cannot move to \"released\"." } }
    ```

    ## Rate limits

    Responses carry `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
    Public score lookups allow 240 requests/minute per caller; escrow endpoints 120.
  contact:
    name: SafePay
    url: https://safepay.ng
  license:
    name: MIT

servers:
  - url: http://localhost:4600
    description: Local development
  - url: https://api.safepay.ng
    description: Production

tags:
  - name: Auth
    description: Accounts and dashboard sessions.
  - name: Escrows
    description: The escrow lifecycle — create, fund, deliver, release.
  - name: Wallet
    description: >
      Balance, the mock Wema top-up, and bank payouts. Session tokens only — an API key
      belongs to an app, not to a person.
  - name: Disputes
    description: Raising and resolving disputes, with automatic triage.
  - name: SafeScore
    description: Portable trust scores. Public — no authentication required.
  - name: Intelligence
    description: AI-assisted risk signals over real SafePay data. Advisory only — it never moves money.
  - name: Developer
    description: Apps, API keys, webhooks and usage logs.
  - name: Admin
    description: Operations console. Admin accounts only.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Auth]
      summary: Service health
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: safepay-api }
                  version: { type: string, example: "1.0.0" }

  /v1/auth/signup:
    post:
      tags: [Auth]
      summary: Create an account
      description: >
        Creates the account and emails a six-digit code. No session token is
        issued here: a new account is inert until its address is proven, so the
        only way forward is `POST /v1/auth/verify-email`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Ada Okonkwo }
                email: { type: string, format: email, example: ada@example.com }
                password: { type: string, minLength: 8, example: correct-horse-battery }
                phone: { type: string, example: "+2348012345678" }
      responses:
        "202":
          description: >
            Account created and a code emailed. Not a session — exchange the code
            for one at /v1/auth/verify-email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: >
        Returns a session token on 200. An account that never completed email
        verification answers 202 with a fresh challenge instead — a correct
        password is not on its own enough to obtain a session.


        Every successful sign-in also triggers an alert email to the account
        holder, with the time, IP address, and user agent of the request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "202":
          description: Correct password, but the email address is still unverified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The account has been suspended.

  /v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Exchange an emailed code for a session
      description: >
        The only route that turns an unverified account into a usable one.


        Codes are six digits, valid for ten minutes, single-use, and allow five
        attempts before the challenge is burned. A burned or expired challenge
        cannot be revived — sign in again for a new one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, example: otp_9Fk2xQpLm4Rt }
                code: { type: string, pattern: "^[0-9]{6}$", example: "418203" }
      responses:
        "200":
          description: Verified; a session token is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: The code is wrong, expired, or already used.
        "429":
          description: Too many attempts. The challenge has been burned.

  /v1/auth/resend-code:
    post:
      tags: [Auth]
      summary: Email a fresh code
      description: >
        Rotates the code on an existing challenge, which invalidates the previous
        one and resets its attempt counter. Rate limited to one request per
        minute per challenge and five per challenge in total.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId]
              properties:
                challengeId: { type: string }
      responses:
        "200":
          description: A new code has been emailed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequired" }
        "400":
          description: The challenge is unknown or already spent.
        "429":
          description: Still inside the cooldown, or too many codes requested.

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in account and its SafeScore
      responses:
        "200":
          description: Account with full score breakdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  score: { $ref: "#/components/schemas/Score" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Auth]
      summary: Update the signed-in account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                verificationTier:
                  type: string
                  enum: [none, phone, bvn_nin, address]
      responses:
        "200":
          description: Updated, with the recalculated score.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  score: { $ref: "#/components/schemas/Score" }

  /v1/escrows:
    post:
      tags: [Escrows]
      summary: Create an escrow
      description: |
        Creates an escrow in `created` state. No money moves until it is funded.

        For `service_milestone`, the milestone amounts must sum exactly to the
        escrow total — SafePay rejects the request otherwise rather than silently
        reconciling the difference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [goods, service_milestone, rental, recurring, in_person]
                amount:
                  type: number
                  description: Amount in naira. Ignored when `amountKobo` is supplied.
                  example: 185000
                amountKobo:
                  type: integer
                  description: Canonical amount in kobo.
                  example: 18500000
                title: { type: string, example: iPhone 13 Pro, 256GB }
                description: { type: string }
                sellerId: { type: string }
                sellerEmail:
                  type: string
                  format: email
                  description: Used when the counterparty is not yet a SafePay user; they are invited.
                role:
                  type: string
                  enum: [buyer, seller]
                  default: buyer
                  description: Whether the caller is paying or being paid.
                milestones:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      amount: { type: number }
                      amountKobo: { type: integer }
            examples:
              goods:
                summary: A phone sale
                value:
                  type: goods
                  amount: 185000
                  title: iPhone 13 Pro, 256GB
                  sellerEmail: seller@example.com
              milestones:
                summary: Freelance work in three stages
                value:
                  type: service_milestone
                  amount: 450000
                  title: Brand website build
                  milestones:
                    - { title: Design mockups, amount: 150000 }
                    - { title: Frontend build, amount: 200000 }
                    - { title: CMS and handover, amount: 100000 }
      responses:
        "201":
          description: Escrow created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  escrow: { $ref: "#/components/schemas/Escrow" }
                  flags:
                    type: array
                    description: Fraud-detection labels raised on creation, if any.
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Escrows]
      summary: List escrows
      parameters:
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated statuses." }
        - { name: type, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [buyer, seller] } }
      responses:
        "200":
          description: Escrows the caller is party to, with a summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  escrows:
                    type: array
                    items: { $ref: "#/components/schemas/Escrow" }
                  summary: { $ref: "#/components/schemas/EscrowSummary" }

  /v1/escrows/{id}:
    get:
      tags: [Escrows]
      summary: Retrieve an escrow with its ledger
      parameters: [{ $ref: "#/components/parameters/EscrowId" }]
      responses:
        "200":
          description: The escrow and its append-only money trail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  escrow: { $ref: "#/components/schemas/Escrow" }
                  ledger:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/escrows/{id}/fund:
    post:
      tags: [Escrows]
      summary: Fund an escrow
      description: |
        Buyer only. Moves `created` → `funded`, debiting `amountKobo` from the buyer's
        SafePay balance. A buyer without enough available returns `409` with
        `error.details.code = "insufficient_balance"` and the shortfall, so a client can
        offer a top-up instead of a dead end.

        There is no timer on the hold. A funded escrow stays funded until the buyer
        releases it, approves its last milestone, or an administrator decides a dispute.
      parameters: [{ $ref: "#/components/parameters/EscrowId" }]
      responses:
        "200": { $ref: "#/components/responses/EscrowResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/escrows/{id}/deliver:
    post:
      tags: [Escrows]
      summary: Confirm delivery, optionally with proof
      description: |
        Seller only. Moves `funded` → `in_progress`.

        `proof` is a photo of the handover — the parcel with its waybill, the item in
        the buyer's hands, the finished work. It is stored separately from the escrow
        and the escrow carries only its metadata; fetch the image from
        `GET /v1/escrows/{id}/proof`.

        Send it as a base64 data URL of at most ~1MB, JPEG, PNG or WebP. The web client
        downscales in the browser before uploading.
      parameters: [{ $ref: "#/components/parameters/EscrowId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, example: Dispatched via GIG, tracking 4471. }
                proof:
                  type: object
                  nullable: true
                  properties:
                    dataUrl:
                      type: string
                      example: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAA...
                    fileName: { type: string, example: handover.jpg }
      responses:
        "200": { $ref: "#/components/responses/EscrowResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/escrows/{id}/proof:
    get:
      tags: [Escrows]
      summary: Fetch the delivery proof
      description: |
        The image uploaded with `POST /v1/escrows/{id}/deliver`. Readable by either
        party, and by an administrator reviewing a dispute — evidence nobody who
        decides disputes can see would be evidence in name only.
      parameters: [{ $ref: "#/components/parameters/EscrowId" }]
      responses:
        "200":
          description: The proof, as a base64 data URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proof: { $ref: "#/components/schemas/DeliveryProof" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/escrows/{id}/release:
    post:
      tags: [Escrows]
      summary: Release the funds
      description: |
        Buyer only, and **irreversible**. Pays the seller, collects the platform fee,
        contributes to the Buyer Protection Reserve, and recalculates both parties'
        SafeScores.
      parameters: [{ $ref: "#/components/parameters/EscrowId" }]
      responses:
        "200": { $ref: "#/components/responses/EscrowResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/escrows/{id}/cancel:
    post:
      tags: [Escrows]
      summary: Cancel an unfunded escrow
      parameters: [{ $ref: "#/components/parameters/EscrowId" }]
      responses:
        "200": { $ref: "#/components/responses/EscrowResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/escrows/{id}/milestones/{milestoneId}/approve:
    post:
      tags: [Escrows]
      summary: Approve and release one milestone
      description: Buyer only. Releases that portion; approving the last one settles the escrow.
      parameters:
        - { $ref: "#/components/parameters/EscrowId" }
        - { name: milestoneId, in: path, required: true, schema: { type: string }, example: ms_2 }
      responses:
        "200": { $ref: "#/components/responses/EscrowResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/escrows/claim:
    post:
      tags: [Escrows]
      summary: Claim an in-person escrow by code
      description: The buyer scans the seller's QR (or types the short code) to join the escrow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: KRT4-9WQP }
      responses:
        "200": { $ref: "#/components/responses/EscrowResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/wallet:
    get:
      tags: [Wallet]
      summary: Balance, statement and payout account
      description: |
        The SafePay balance is money that is available right now: it excludes anything
        held inside a funded escrow, and it is already net of every fee charged. Each
        entry in `entries` carries the balance it produced, so the statement reconciles.

        Session tokens only. An API key belongs to an app rather than a person, and must
        never be able to move someone's money to a bank account of its choosing.
      responses:
        "200":
          description: Wallet state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/wallet/bank:
    put:
      tags: [Wallet]
      summary: Set the payout account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber, accountName]
              properties:
                bankCode: { type: string, example: "035" }
                accountNumber: { type: string, example: "0123456789" }
                accountName: { type: string, example: ADA OKONKWO }
      responses:
        "200":
          description: The saved account.
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Wallet]
      summary: Remove the payout account
      responses:
        "200": { description: Removed. }

  /v1/wallet/topups:
    post:
      tags: [Wallet]
      summary: Open a virtual account for one transfer
      description: |
        Returns a Wema account number in SafePay's name, bound to one exact amount and
        valid for 30 minutes. Any pending top-up for the same user is cancelled first —
        two live numbers expecting two different amounts is the confusion this avoids.

        **Mocked.** No Wema API is called and the number is generated. In production a
        bank webhook would credit the balance; here `POST .../confirm` stands in for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountKobo: { type: integer, example: 5000000 }
                amount: { type: number, description: Naira, if you would rather not send kobo. }
      responses:
        "201":
          description: The virtual account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  topup: { $ref: "#/components/schemas/Topup" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/wallet/topups/{id}/confirm:
    post:
      tags: [Wallet]
      summary: Claim that the transfer was sent
      description: The mock stand-in for a bank webhook. Idempotent — confirming twice credits once.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Credited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  topup: { $ref: "#/components/schemas/Topup" }
                  balanceKobo: { type: integer }
        "409":
          description: Expired or cancelled — `error.details.code = "topup_expired"`.

  /v1/wallet/withdrawals:
    post:
      tags: [Wallet]
      summary: Withdraw to the payout account
      description: |
        Debits the balance and writes a payout record. Requires a payout account —
        without one this returns `409` with `error.details.code = "no_bank_account"`.

        **Mocked.** No money leaves SafePay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountKobo: { type: integer, example: 5000000 }
      responses:
        "201":
          description: Paid.
        "409":
          description: No payout account, or `insufficient_balance` with the shortfall.

  /v1/disputes:
    post:
      tags: [Disputes]
      summary: Raise a dispute
      description: |
        Freezes the escrow and classifies the complaint before any human reads it —
        category, severity, confidence and a suggested next step for the reviewer.
        Uses Gemini when configured, and a deterministic rule-based classifier
        otherwise, so the flow never depends on a third party being up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [escrowId, reason]
              properties:
                escrowId: { type: string }
                reason: { type: string, minLength: 12 }
                evidenceUrls:
                  type: array
                  items: { type: string, format: uri }
      responses:
        "201":
          description: Dispute opened and triaged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispute: { $ref: "#/components/schemas/Dispute" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Disputes]
      summary: List disputes
      description: Regular accounts see their own; admins see everything.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, under_review, resolved] } }
      responses:
        "200":
          description: Disputes visible to the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  disputes:
                    type: array
                    items: { $ref: "#/components/schemas/Dispute" }

  /v1/disputes/{id}/resolve:
    post:
      tags: [Disputes]
      summary: Resolve a dispute
      description: Admin only. Settles the escrow and updates both SafeScores.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [release_to_seller, refund_buyer]
                note: { type: string }
                coverFromReserve:
                  type: boolean
                  description: Pay the refund out of the Buyer Protection Reserve.
      responses:
        "200":
          description: Resolved.
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/score/{userId}:
    get:
      tags: [SafeScore]
      summary: Look up a SafeScore
      description: |
        **Public — no authentication required.** This is reputation portability: any
        third-party application can check a seller before money changes hands, the way
        a credit bureau works, but for everyday trading.

        Accepts a user id or an email address. The full component breakdown and total
        value settled are returned only to the score's owner or an admin.
      security: []
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string }, example: usr_JbRmBoCmk1JrSKft }
      responses:
        "200":
          description: The public trust profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicScore" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/score/{userId}/badge.svg:
    get:
      tags: [SafeScore]
      summary: Embeddable Trust Badge
      description: |
        Returns a self-contained SVG. Drop it anywhere an image works — an Instagram
        bio link, a WhatsApp storefront, a website — with no SDK and no JavaScript:

        ```html
        <img src="https://api.safepay.ng/v1/score/usr_123/badge.svg" width="300" height="76">
        ```
      security: []
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: theme, in: query, schema: { type: string, enum: [light, dark], default: light } }
      responses:
        "200":
          description: An SVG badge, cacheable for 5 minutes.
          content:
            image/svg+xml:
              schema: { type: string }

  /v1/intelligence/escrows/{id}/risk:
    get:
      tags: [Intelligence]
      summary: Assess a transaction's risk
      description: |
        Computes a risk score and level from deterministic signals over real SafePay
        data — the seller's completed transactions, dispute rate, verification tier,
        account age, this amount versus their average, and any open fraud flags. The
        score and level always come from that rule engine, never from the AI.

        When `GEMINI_API_KEY` is configured, Gemini is given the same signals object
        (never raw text, never asked to invent facts) and may rewrite `reasons` and
        `recommendation` into clearer language — it cannot change the score or level.
        Without a key, or if the call fails or returns something unvalidated, the
        rule engine's own `reasons`/`recommendation` ship as-is; `source` reports
        which path produced the result.

        Only the buyer or seller on the escrow may request its assessment — the same
        rule as `GET /v1/escrows/{id}`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: esc_JbRmBoCmk1JrSKft }
      responses:
        "200":
          description: A structured risk assessment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk: { $ref: "#/components/schemas/TransactionRisk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/intelligence/dispute:
    post:
      tags: [Intelligence]
      summary: Assess a dispute (advisory only)
      description: |
        Combines the dispute's auto-triage classification with the underlying
        transaction's risk assessment into a short human-readable assessment,
        a confidence figure, key findings, and a recommendation.

        **This endpoint never decides a payout.** `recommendation` is limited to
        `KEEP_FUNDS_FROZEN` or `ESCALATE_TO_HUMAN_REVIEW` — both leave the money
        exactly where the dispute already froze it. The actual release/refund
        decision remains `POST /v1/disputes/{id}/resolve`, made by an admin.

        Reachable by either party to the dispute, or an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disputeId]
              properties:
                disputeId: { type: string }
      responses:
        "200":
          description: A structured dispute assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeRisk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/developer/apps:
    post:
      tags: [Developer]
      summary: Create an app and issue API keys
      description: The **only** time raw keys are returned. SafePay stores hashes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                webhookUrl: { type: string, format: uri }
      responses:
        "201":
          description: App created with its key pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { $ref: "#/components/schemas/App" }
                  keys:
                    type: object
                    properties:
                      test: { type: string, example: sk_test_AhpZn4cEtTA_IE16mui_MwQdrqvzPY-8 }
                      live: { type: string }
                  notice: { type: string }
    get:
      tags: [Developer]
      summary: List your apps
      responses:
        "200":
          description: Apps owned by the caller.

  /v1/developer/apps/{id}/rotate:
    post:
      tags: [Developer]
      summary: Rotate an API key
      description: The previous key stops working immediately.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [test, live], default: test }
      responses:
        "200":
          description: A new key, shown once.

  /v1/developer/apps/{id}/webhooks:
    get:
      tags: [Developer]
      summary: Webhook delivery log
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Recent deliveries with attempt counts and errors.

  /v1/admin/overview:
    get:
      tags: [Admin]
      summary: Platform overview
      description: Totals, 14-day settlement series, Protection Reserve balance and recent ledger.
      responses:
        "200":
          description: Console data.
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A dashboard session JWT, or an API key beginning `sk_test_` / `sk_live_`.

  parameters:
    EscrowId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: esc_Xk4VrVTBEROWlXi7

  responses:
    EscrowResponse:
      description: The updated escrow.
      content:
        application/json:
          schema:
            type: object
            properties:
              escrow: { $ref: "#/components/schemas/Escrow" }
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not permitted to do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The resource is not in a state that allows this transition.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: conflict }
            message: { type: string }
            details: { type: object }

    User:
      type: object
      properties:
        id: { type: string, example: usr_JbRmBoCmk1JrSKft }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [user, admin] }
        emailVerified:
          type: boolean
          description: >
            False only for an account that has not yet cleared the OTP gate. Such
            an account holds no session and is hidden from the counterparty
            directory, so in practice every user you can see here is true.
          example: true
        verificationTier: { type: string, enum: [none, email, phone, bvn_nin, address] }
        safeScore: { type: integer, example: 68 }
        scoreTier: { type: string, enum: [new, building, trusted, verified_pro] }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        token: { type: string, description: Bearer this on subsequent requests. }
        user: { $ref: "#/components/schemas/User" }

    VerificationRequired:
      type: object
      description: >
        Returned instead of a session whenever an email address still has to be
        proven. Deliberately carries no token and no code — only the handle needed
        to submit one.
      properties:
        verificationRequired:
          type: boolean
          example: true
        challengeId:
          type: string
          description: Pass this back to /v1/auth/verify-email alongside the code.
          example: otp_9Fk2xQpLm4Rt
        email:
          type: string
          description: >
            Masked, so a client can say which mailbox to check without the
            response echoing an address the caller may only have guessed.
          example: a****@example.com
        expiresInMinutes:
          type: integer
          example: 10

    Party:
      type: object
      nullable: true
      properties:
        id: { type: string, nullable: true }
        name: { type: string }
        safeScore: { type: integer }
        scoreTier: { type: string }
        invited: { type: boolean, description: Present when the counterparty has no SafePay account yet. }

    Milestone:
      type: object
      properties:
        id: { type: string, example: ms_1 }
        title: { type: string }
        amountKobo: { type: integer }
        status: { type: string, enum: [pending, approved] }
        approvedAt: { type: string, format: date-time, nullable: true }

    Escrow:
      type: object
      properties:
        id: { type: string, example: esc_Xk4VrVTBEROWlXi7 }
        type: { type: string, enum: [goods, service_milestone, rental, recurring, in_person] }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [created, funded, in_progress, released, disputed, refunded, cancelled, expired]
        amountKobo: { type: integer, example: 18500000 }
        feeKobo: { type: integer, example: 277500 }
        netToSellerKobo: { type: integer, example: 18222500 }
        currency: { type: string, example: NGN }
        buyer: { $ref: "#/components/schemas/Party" }
        seller: { $ref: "#/components/schemas/Party" }
        milestones:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/Milestone" }
        claimCode: { type: string, nullable: true, example: KRT4-9WQP }
        flagged: { type: boolean }
        deliveryProof:
          allOf: [{ $ref: "#/components/schemas/DeliveryProofMeta" }]
          nullable: true
        fundedAt: { type: string, format: date-time, nullable: true }
        releasedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        timeline:
          type: array
          items:
            type: object
            properties:
              event: { type: string }
              at: { type: string, format: date-time }
              note: { type: string, nullable: true }

    EscrowSummary:
      type: object
      properties:
        total: { type: integer }
        balanceKobo:
          type: integer
          description: The caller's available SafePay balance. Excludes money held in escrow.
        inEscrowKobo: { type: integer }
        releasedKobo:
          type: integer
          description: >
            Settled value, net of the SafePay fee on the caller's own side. A seller who
            sold for 100,000 sees 98,500 here, because that is what reached their balance.
        earnedKobo: { type: integer }
        feesPaidKobo: { type: integer }
        openDisputes: { type: integer }
        awaitingAction: { type: integer }

    DeliveryProofMeta:
      type: object
      description: What the escrow carries. The image itself is at /v1/escrows/{id}/proof.
      properties:
        id: { type: string, example: prf_9Kd2mXqRw0PbA1zY }
        fileName: { type: string, nullable: true, example: handover.jpg }
        byteSize: { type: integer, example: 148231 }
        contentType: { type: string, example: image/jpeg }
        uploadedAt: { type: string, format: date-time }
        uploadedById: { type: string }

    DeliveryProof:
      allOf:
        - $ref: "#/components/schemas/DeliveryProofMeta"
        - type: object
          properties:
            escrowId: { type: string }
            dataUrl: { type: string, description: base64 data URL of the image. }

    WalletSummary:
      type: object
      properties:
        balanceKobo: { type: integer, example: 15400000 }
        bankAccount:
          type: object
          nullable: true
          properties:
            bankCode: { type: string }
            bankName: { type: string }
            accountNumber: { type: string }
            accountName: { type: string }
            addedAt: { type: string, format: date-time }
        totals:
          type: object
          properties:
            fundedInKobo: { type: integer }
            earnedKobo: { type: integer }
            spentKobo: { type: integer }
            feesPaidKobo: { type: integer }
            withdrawnKobo: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/WalletEntry" }
        payouts: { type: array, items: { type: object } }
        banks: { type: array, items: { type: object } }
        topupExpiryMinutes: { type: integer, example: 30 }

    WalletEntry:
      type: object
      description: One movement, signed. Positive credits, negative debits.
      properties:
        id: { type: string }
        type:
          type: string
          enum: [topup, escrow_fund, escrow_release, escrow_refund, fee, withdrawal]
        amountKobo: { type: integer, example: -18500000 }
        balanceAfterKobo: { type: integer }
        note: { type: string, nullable: true }
        escrowId: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Topup:
      type: object
      description: A mock Wema virtual account, bound to one amount, valid for 30 minutes.
      properties:
        id: { type: string, example: top_TNBDqgVIWR1gvdDw }
        amountKobo: { type: integer, example: 5000000 }
        bankName: { type: string, example: Wema Bank }
        bankCode: { type: string, example: "035" }
        accountNumber: { type: string, example: "9929485198" }
        accountName: { type: string, example: SafePay }
        reference: { type: string, example: SP-WR1GVDDW }
        status: { type: string, enum: [pending, completed, expired, cancelled] }
        mock: { type: boolean, example: true }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    LedgerEntry:
      type: object
      description: Append-only. A correction is a new, opposite entry — never an edit.
      properties:
        id: { type: string }
        escrowId: { type: string }
        type: { type: string, enum: [fund, release, refund, fee, reserve, reserve_payout] }
        amountKobo: { type: integer }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Triage:
      type: object
      description: Produced automatically the moment a dispute is filed.
      properties:
        category:
          type: string
          enum: [non_delivery, not_as_described, service_incomplete, partial_delivery, damaged, likely_fraud, buyer_remorse, other]
        label: { type: string, example: Likely fraud }
        severity: { type: string, enum: [low, medium, high, critical] }
        confidence: { type: number, format: float, example: 0.77 }
        summary: { type: string }
        guidance: { type: string, example: Freeze the counterparty account and escalate to compliance before refunding. }
        source: { type: string, example: "rules", description: "`rules` or `gemini:<model>`." }

    Dispute:
      type: object
      properties:
        id: { type: string }
        escrowId: { type: string }
        raisedById: { type: string }
        raisedByRole: { type: string, enum: [buyer, seller] }
        againstId: { type: string }
        reason: { type: string }
        evidenceUrls:
          type: array
          items: { type: string, format: uri }
        ai: { $ref: "#/components/schemas/Triage" }
        status: { type: string, enum: [open, under_review, resolved] }
        resolution:
          type: object
          nullable: true
          properties:
            outcome: { type: string, enum: [release_to_seller, refund_buyer] }
            note: { type: string }
        createdAt: { type: string, format: date-time }

    TransactionRisk:
      type: object
      description: |
        `riskScore` and `riskLevel` always come from SafePay's deterministic rule
        engine, never from the AI. `reasons` and `recommendation` may be rewritten
        by Gemini for clarity when configured, but must stay grounded in `signals`.
      properties:
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        riskScore: { type: integer, minimum: 0, maximum: 100, example: 42 }
        reasons:
          type: array
          items: { type: string }
          example:
            - "Transaction amount is 6.1x the seller's average transaction size."
            - "Seller has not completed identity verification."
        recommendation: { type: string, example: "Request additional verification from the seller." }
        signals:
          type: object
          description: The objective facts the score was computed from — amounts, dispute rates, verification tier, account age, and any open fraud flags.
        source:
          type: string
          description: "`rules` or `gemini:<model>` — which path produced `reasons`/`recommendation`."
          example: rules
        assessedAt: { type: string, format: date-time }

    DisputeRisk:
      type: object
      description: Advisory only. Never picks a financial outcome — see the endpoint description.
      properties:
        assessment: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, example: 0.62 }
        keyFindings:
          type: array
          items: { type: string }
        recommendation: { type: string, enum: [KEEP_FUNDS_FROZEN, ESCALATE_TO_HUMAN_REVIEW] }
        source: { type: string, example: rules }
        assessedAt: { type: string, format: date-time }

    Score:
      type: object
      description: |
        The full, explainable score. Components are additive and bounded, so the
        number can always be interrogated — a trust score nobody can audit is a
        trust score nobody trusts.
      properties:
        userId: { type: string }
        score: { type: integer, minimum: 0, maximum: 100, example: 68 }
        tier: { type: string, enum: [new, building, trusted, verified_pro] }
        tierLabel: { type: string, example: Trusted }
        breakdown:
          type: object
          properties:
            volume: { type: number, description: "Completed deals (max 25)." }
            value: { type: number, description: "Value settled (max 10)." }
            reliability: { type: number, description: "Dispute-free record, scaled by evidence (max 25)." }
            speed: { type: number, description: "Median time to confirm (max 10)." }
            verification: { type: number, description: "Identity assurance tier (max 15)." }
            age: { type: number, description: "Account tenure (max 5)." }
            diversity: { type: number, description: "Distinct counterparties — anti-gaming (max 10)." }
        weights: { type: object }
        stats:
          type: object
          properties:
            escrowsCompleted: { type: integer }
            disputeRatePct: { type: number }
            uniqueCounterparties: { type: integer }
            medianReleaseHours: { type: number, nullable: true }
            totalValueSettledNaira: { type: integer }
            accountAgeDays: { type: integer }
            concentrationFlag:
              type: boolean
              description: True when volume is concentrated in too few counterparties; the score is capped.

    PublicScore:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            memberSince: { type: string, format: date-time }
        score: { type: integer, example: 68 }
        tier: { type: string }
        tierLabel: { type: string }
        stats:
          type: object
          properties:
            escrowsCompleted: { type: integer }
            disputeRatePct: { type: number }
            uniqueCounterparties: { type: integer }
            verificationTier: { type: string }
            medianReleaseHours: { type: number, nullable: true }
        updatedAt: { type: string, format: date-time }

    App:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        webhookUrl: { type: string, nullable: true }
        webhookSecret: { type: string, example: whsec_… }
        subscribedEvents:
          type: array
          items: { type: string }
        testKeyPreview: { type: string, description: Masked. The raw key is shown only at creation or rotation. }
        liveKeyPreview: { type: string }
        liveEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }

  examples: {}

webhooks:
  escrowEvent:
    post:
      summary: Signed escrow event
      description: |
        SafePay POSTs to your configured endpoint with these headers:

        ```
        SafePay-Event: escrow.released
        SafePay-Delivery: whl_…
        SafePay-Signature: t=1755520000,v1=<hex hmac-sha256>
        ```

        `v1` is an HMAC-SHA256 over `` `${t}.${rawBody}` `` keyed with your app's
        `webhookSecret`. Verify it, and reject any request whose timestamp falls
        outside your tolerance window — that is what stops a captured payload being
        replayed later.

        Deliveries retry four times with backoff (immediate, 2s, 10s, 60s). Respond
        `2xx` to acknowledge.

        Events: `escrow.created`, `escrow.funded`, `escrow.delivered`,
        `escrow.released`, `escrow.disputed`, `escrow.refunded`,
        `dispute.resolved`, `score.updated`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, example: whl_8fJ2k1LmQ0aZ }
                event: { type: string, example: escrow.released }
                createdAt: { type: string, format: date-time }
                data: { $ref: "#/components/schemas/Escrow" }
      responses:
        "200":
          description: Acknowledged.
