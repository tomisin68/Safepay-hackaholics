<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SafePay">
  <title>SafePay</title>
  <defs>
    <linearGradient id="sp-badge" x1="0.06" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#B11892"/>
      <stop offset="1" stop-color="#3B1439"/>
    </linearGradient>
    <clipPath id="sp-rc">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sp-rc)">
    <rect x="0" y="0" width="512" height="512" fill="url(#sp-badge)"/>
    <!-- geometric light seam, echoes Wema's intersecting-line mark -->
    <path d="M-40 392 L200 152 L232 184 L-8 424 Z" fill="#FFFFFF" opacity="0.05"/>
    <path d="M300 -40 L560 220 L560 168 L352 -40 Z" fill="#FFFFFF" opacity="0.05"/>
  </g>

  <!-- Shield: protection -->
  <path d="M256 96 L368 134 V248 C368 328 320 384 256 412 C192 384 144 328 144 248 V134 Z"
        fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Check: the confirmed release -->
  <path d="M204 256 L241 294 L320 206"
        fill="none" stroke="#FFFFFF" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two counterparties, connected -->
  <circle cx="368" cy="134" r="15" fill="#33CBB0"/>
  <circle cx="144" cy="134" r="15" fill="#33CBB0"/>
</svg>
